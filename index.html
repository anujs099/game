<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Game</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <input type="number" id="timer" placeholder="seconds" min="1" />
            <button id="start" name="start">Start</button>
            <button id="pause" name="pause">Pause</button>
            <button id="reset" name="reset">Reset</button>
        </div>
        <div class="main-area" id="play-container">

        </div>
        <div class="table-container">
            <table>
                <tr>
                    <th>Reaction</th>
                    <th>Time (s)</th>
                </tr>
            </table>
        </div>
        <script src="/src/script.js" type="module"></script>
    </div>
</body>

</html>
